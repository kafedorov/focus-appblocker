name: Build and release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusguard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check version and tag
        id: version
        run: python3 scripts/ci_release.py metadata

      - name: Check release helper
        run: python3 -m unittest discover -s scripts -p 'test_ci_release.py' -v

      - name: Install the required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is missing}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          # Only sdkmanager's status matters here; 'yes' normally exits on SIGPIPE.
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore and check the existing signing key
        env:
          FOCUSGUARD_KEYSTORE_BASE64: ${{ secrets.FOCUSGUARD_KEYSTORE_BASE64 }}
        run: python3 scripts/ci_release.py restore-key

      - name: Build APK and run Android checks
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:lintDebug :app:coreCheck

      - name: Verify APK and prepare release files
        run: python3 scripts/ci_release.py package

      - name: Save the checked APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focusguard-${{ steps.version.outputs.version }}
          path: |
            dist/FocusGuard-*.apk
            dist/FocusGuard-*.sha256
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

      - name: Remove the runner's temporary signing key
        if: always()
        run: python3 scripts/ci_release.py cleanup-key

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the checked APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: focusguard-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish a new release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APK="FocusGuard-$APP_VERSION-debug.apk"
          sha256sum --check "$APK.sha256"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "::error::This release already exists. It will not be overwritten. Use a new application version and tag."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$APK" "$APK.sha256" \
            --repo "$GH_REPO" --verify-tag \
            --title "Фокус $APP_VERSION" --notes-file RELEASE_NOTES.md
